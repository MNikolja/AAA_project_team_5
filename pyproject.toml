version = "0.1.0" # submission version must be 1.0.0
description = "Quarto template for IS3 team project reports" # REPLACE
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "ipykernel>=6.20.0",
    "pyyaml>=6.0.0",
    "jupyter>=1.0.0",
    "polars>=1.41.2",
    "fastexcel>=0.20.2",
    "openmeteo-requests>=1.7.5",
    "requests-cache>=1.3.2",
    "retry-requests>=2.0.0",
    "geopandas>=1.1.3",
    "openpyxl>=3.1.5",
    "pyarrow>=24.0.0",
    "shapely>=2.1.2",
    "osmnx>=2.0.7",
    "scikit-learn>=1.7.2",
]

[tool.uv]
managed = true
package = false
